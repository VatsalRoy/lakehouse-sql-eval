bundle:
  name: lakehouse-sql-eval

# Pull in every job/pipeline definition from the resources folder
include:
  - resources/*.yml

# Values we reuse everywhere, so we never hard-code them
variables:
  catalog:
    description: Unity Catalog catalog to use
    default: workspace
  llm_endpoint:
    description: Foundation Model endpoint used by ai_query
    default: databricks-meta-llama-3-3-70b-instruct
  judge_endpoint:
    description: LLM used as the judge
    default: databricks-meta-llama-3-3-70b-instruct
  warehouse_id:
    description: SQL warehouse the app queries
    lookup:
      warehouse: "Serverless Starter Warehouse"
    
targets:
  dev:
    mode: development     # prefixes resource names with [dev yourname], safe for experimenting
    default: true
    workspace:
      host: https://dbc-2b97a233-53d5.cloud.databricks.com